[project]
name = "customer-support-triage"
version = "0.1.0"
description = "AI Support Ticket Triage System"
authors = [
    {name = "Jasmine",email = "jasminesardana@gmail.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.6.1,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
